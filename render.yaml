# Temporary, small-world trial; PostgreSQL must be provisioned and initialized first.
# The external URL preserves the engine's existing verify-full TLS policy.
services:
  - type: web
    name: phyrex-engine-trial-sg
    runtime: node
    plan: free
    region: singapore
    branch: main
    rootDir: world-engine
    buildCommand: npm ci --ignore-scripts
    startCommand: node demo/engine-serve-cli.js --world-id phyrex-trial --host 0.0.0.0 --port "$PORT" --interval 60000 --shutdown-timeout 25000
    healthCheckPath: /health/ready
    numInstances: 1
    autoDeployTrigger: "off"
    maxShutdownDelaySeconds: 30
    previews:
      generation: "off"
    envVars:
      - key: NODE_VERSION
        value: "22.23.3"
      - key: NODE_OPTIONS
        value: "--max-old-space-size=160"
      - key: WORLD_ENGINE_DATABASE_URL
        sync: false
      - key: WORLD_ENGINE_DB_SCHEMA
        value: phyrex_trial
      - key: WORLD_ENGINE_DB_SSL_MODE
        value: verify-full
      - key: WORLD_ENGINE_DB_POOL_SIZE
        value: "2"
      - key: WORLD_ENGINE_COMMAND_QUEUE_MAX_PENDING
        value: "100"
      - key: WORLD_ENGINE_COMMAND_QUEUE_MAX_PLAYER_PENDING
        value: "20"
