name: Materialize command API audit store

on:
  push:
    branches: [feature/command-api-audit]
    paths: ['.github/workflows/materialize-command-api-audit-store.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/command-api-audit
          fetch-depth: 0
      - name: Patch PostgreSQL audit store
        run: |
          python3 .github/scripts/materialize-command-api-audit-store.py
          node --check world-engine/storage/postgres/store.js
          git diff --check
      - name: Commit audit store
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add world-engine/storage/postgres/store.js
          git commit -m 'Add durable command API audit store'
          git push origin HEAD:feature/command-api-audit
