name: Prepare PostgreSQL development source

on:
  push:
    branches: [feature/postgres-transactional-store]
    paths: ['.github/workflows/postgres-development-source.yml']

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Create isolated dependency lock and archive tracked source
        run: |
          mkdir -p "$RUNNER_TEMP/pg-development/dependencies"
          cp world-engine/package.json "$RUNNER_TEMP/pg-development/dependencies/package.json"
          npm install --prefix "$RUNNER_TEMP/pg-development/dependencies" --ignore-scripts --save-exact pg@8.23.0
          npm audit --prefix "$RUNNER_TEMP/pg-development/dependencies" --omit=dev --audit-level=high
          git archive --format=tar HEAD world-engine package.json .github/workflows > "$RUNNER_TEMP/pg-development/source.tar"
          git rev-parse HEAD > "$RUNNER_TEMP/pg-development/source-commit.txt"
          tar -cf "$RUNNER_TEMP/pg-development/dependencies.tar" -C "$RUNNER_TEMP/pg-development/dependencies" node_modules package.json package-lock.json
      - uses: actions/upload-artifact@v4
        with:
          name: postgres-development-source
          path: |
            ${{ runner.temp }}/pg-development/source.tar
            ${{ runner.temp }}/pg-development/source-commit.txt
            ${{ runner.temp }}/pg-development/dependencies.tar
          retention-days: 1
          if-no-files-found: error
