name: Materialize command API clock injection

on:
  push:
    branches: [feature/command-api-rate-limit]
    paths: ['.github/workflows/materialize-rate-limit-clock.yml']

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/command-api-rate-limit
          fetch-depth: 0
      - name: Inject deterministic test clocks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
            'world-engine/tests/durable-command-api-test.js': [
              ("createDurableCommandApiServer({ store: f.store, maxBodyBytes: 1024 })",
               "createDurableCommandApiServer({ store: f.store, maxBodyBytes: 1024, rateLimitNow: () => 0 })"),
            ],
            'world-engine/tests/durable-command-api-rate-limit-test.js': [
              ("createDurableCommandApiServer({ store: f.store, sourceRateLimit: 2, accountSubmitRateLimit: 100, accountReadRateLimit: 100 })",
               "createDurableCommandApiServer({ store: f.store, sourceRateLimit: 2, accountSubmitRateLimit: 100, accountReadRateLimit: 100, rateLimitNow: () => 0 })"),
            ],
            'world-engine/tests/integration/postgres-command-api.js': [
              ("createDurableCommandApiServer({ store, maxBodyBytes: 2048 })",
               "createDurableCommandApiServer({ store, maxBodyBytes: 2048, rateLimitNow: () => 0 })"),
              ("createDurableCommandApiServer({ store: racingStore })",
               "createDurableCommandApiServer({ store: racingStore, rateLimitNow: () => 0 })"),
            ],
          }
          for filename, pairs in replacements.items():
            path = Path(filename)
            text = path.read_text()
            for old, new in pairs:
              if text.count(old) != 1:
                raise SystemExit(f'{filename}: expected anchor exactly once: {old}')
              text = text.replace(old, new)
            path.write_text(text)
          PY
          node --check world-engine/tests/durable-command-api-test.js
          node --check world-engine/tests/durable-command-api-rate-limit-test.js
          node --check world-engine/tests/integration/postgres-command-api.js
          git diff --check
      - name: Commit clock injection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add world-engine/tests/durable-command-api-test.js world-engine/tests/durable-command-api-rate-limit-test.js world-engine/tests/integration/postgres-command-api.js
          git commit -m 'Inject clocks into command API tests'
          git push origin HEAD:feature/command-api-rate-limit
