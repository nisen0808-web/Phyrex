name: Materialize reviewed engine regression fixes

on:
  push:
    branches: [feature/database-startup-recovery]
    paths: ['.github/workflows/world-engine-materialize-fixes.yml']

permissions:
  contents: write

concurrency:
  group: materialize-engine-regression-fixes
  cancel-in-progress: false

jobs:
  validate-and-commit:
    if: github.repository == 'nisen0808-web/Phyrex' && github.ref == 'refs/heads/feature/database-startup-recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify branch and materialize exactly the locally tested sources
        run: |
          test "$(git ls-remote origin refs/heads/feature/database-startup-recovery | cut -f1)" = "$GITHUB_SHA"
          python3 .github/maintenance/materialize-engine-fixes.py
          git diff --check
          git diff --stat
      - name: Run all 83 regressions
        run: |
          mkdir -p "$RUNNER_TEMP/engine-fix-logs"
          npm --prefix world-engine test 2>&1 | tee "$RUNNER_TEMP/engine-fix-logs/regressions.log"
          grep -F '83 tests: 83 passed, 0 failed' "$RUNNER_TEMP/engine-fix-logs/regressions.log"
      - name: Run mandatory 1000 tick stress
        run: |
          npm run stress 2>&1 | tee "$RUNNER_TEMP/engine-fix-logs/stress.log"
          grep -F '1000 tick stability test passed' "$RUNNER_TEMP/engine-fix-logs/stress.log"
      - name: Commit verified sources to the same feature branch only
        run: |
          test "$(git ls-remote origin refs/heads/feature/database-startup-recovery | cut -f1)" = "$GITHUB_SHA"
          mapfile -t files < "$RUNNER_TEMP/engine-fix-paths.txt"
          git add -- "${files[@]}"
          git rm -- .github/maintenance/engine-regression-edits-*.json .github/maintenance/materialize-engine-fixes.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix engine regressions and restore complete deterministic test coverage'
          git push origin HEAD:refs/heads/feature/database-startup-recovery
          echo "VERIFIED_SOURCE_COMMIT=$(git rev-parse HEAD)"
          echo "VERIFIED_SOURCE_TREE=$(git rev-parse HEAD^{tree})"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-engine-regression-logs
          path: ${{ runner.temp }}/engine-fix-logs/
          retention-days: 2
          if-no-files-found: warn
