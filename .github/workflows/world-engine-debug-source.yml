name: World Engine Debug Source

on:
  push:
    branches: [feature/database-startup-recovery]
    paths: ['.github/workflows/world-engine-debug-source.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source only
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/engine-debug"
          git archive --format=tar HEAD world-engine package.json .github/workflows > "$RUNNER_TEMP/engine-debug/source.tar"
          git rev-parse HEAD > "$RUNNER_TEMP/engine-debug/source-commit.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: world-engine-debug-source
          path: ${{ runner.temp }}/engine-debug/
          retention-days: 1
          if-no-files-found: error
