name: Materialize command API audit HTTP

on:
  push:
    branches: [feature/command-api-audit]
    paths: ['.github/workflows/materialize-command-api-audit-http.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/command-api-audit
          fetch-depth: 0
      - name: Patch command API audit integration
        run: |
          python3 .github/scripts/materialize-command-api-audit-http.py
          node --check world-engine/core/durable-command-api-engine.js
          git diff --check
      - name: Commit command API audit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add world-engine/core/durable-command-api-engine.js
          git commit -m 'Audit authenticated durable command API operations'
          git push origin HEAD:feature/command-api-audit
