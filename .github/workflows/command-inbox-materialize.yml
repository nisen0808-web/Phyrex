name: Materialize command inbox compatibility fix

on:
  push:
    branches: [feature/postgres-command-inbox]
    paths: ['.github/workflows/command-inbox-materialize.yml']

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  update-test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/postgres-command-inbox
          fetch-depth: 0
      - name: Replace fixed migration count with migration registry length
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('world-engine/tests/integration/postgres-store.js')
          text = path.read_text()
          old = "assert.strictEqual(versions.reduce((sum, r) => sum + r.applied, 0), 1);"
          new = "assert.strictEqual(versions.reduce((sum, r) => sum + r.applied, 0), MIGRATIONS.length);"
          if text.count(old) != 1:
              raise SystemExit('expected migration assertion not found exactly once')
          path.write_text(text.replace(old, new))
          PY
          git diff --check
      - name: Commit exact compatibility change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add world-engine/tests/integration/postgres-store.js
          git commit -m 'Make PostgreSQL migration integration test version-aware'
          git push origin HEAD:feature/postgres-command-inbox
