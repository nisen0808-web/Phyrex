name: World Engine Endurance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  endurance:
    name: endurance-node-${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: world_engine_ci
          POSTGRES_USER: world_engine
          POSTGRES_PASSWORD: ci-only-ephemeral-password
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U world_engine -d world_engine_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install locked driver
        run: npm ci --prefix world-engine --ignore-scripts
      - name: Run 1000 tick PostgreSQL process restart and recovery gate
        env:
          WORLD_ENGINE_TEST_DATABASE_URL: postgresql://world_engine:ci-only-ephemeral-password@127.0.0.1:${{ job.services.postgres.ports[5432] }}/world_engine_ci
        run: |
          mkdir -p world-engine/output/ci
          npm --prefix world-engine run test:postgres:endurance 2>&1 | tee world-engine/output/ci/endurance.log
          grep -F 'postgres engine endurance completed 6 scenario groups: 6 passed, 0 failed' world-engine/output/ci/endurance.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-endurance-node-${{ matrix.node }}-logs
          path: world-engine/output/ci/endurance.log
          if-no-files-found: error
